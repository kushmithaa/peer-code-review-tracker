<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Peer Code Review Tracker</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="brand-small">
                <div class="brand-logo">
                    PR
                </div>
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Join the Peer Code Review platform
            </p>

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                >

            </div>

            <div class="form-group">

                <label for="email">
                    Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 6 characters"
                >

            </div>

            <div class="form-group">

                <label for="role">
                    Account Role
                </label>

                <select id="role">

                    <option value="">
                        Select your role
                    </option>

                    <option value="Developer">
                        Developer
                    </option>

                    <option value="Reviewer">
                        Reviewer
                    </option>

                    <option value="Team">
                        Team / Admin
                    </option>

                </select>

            </div>

            <button id="registerBtn">
                Create Account
            </button>

            <p id="message"></p>

            <p class="switch-page">
                Already have an account?
                <a href="../index.html">
                    Login
                </a>
            </p>

            <p class="footer-text">
                Peer Code Review & Skill-Growth Tracker
            </p>

        </div>

    </div>

    <script
        type="module"
        src="../js/register.js">
    </script>

</body>

</html>
